<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Letter For You</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #f0f7ff;
            --paper-bg: #ffffff;
            --text-color: #2c3e50;
            --accent-blue: #70a1ff;
            --soft-blue: #a4b0be;
            --doodle-color: #4a69bd;
            --line-color: #dcdde1;
            --grid-line: rgba(74, 105, 189, 0.15);
            --shadow: rgba(74, 105, 189, 0.15);
        }

        [data-theme="dark"] {
            --bg-color: #1e272e;
            --paper-bg: #2d3436;
            --text-color: #f5f6fa;
            --accent-blue: #70a1ff;
            --soft-blue: #57606f;
            --doodle-color: #70a1ff;
            --line-color: #485460;
            --grid-line: rgba(112, 161, 255, 0.15);
            --shadow: rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            /* Blue Grid Doodle Background */
            background-image: 
                linear-gradient(var(--grid-line) 1.5px, transparent 1.5px),
                linear-gradient(90deg, var(--grid-line) 1.5px, transparent 1.5px);
            background-size: 28px 28px;
            overflow-x: hidden;
            position: relative;
        }

        /* Floating background elements */
        .bg-doodle {
            position: absolute;
            color: var(--doodle-color);
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
            animation: float 6s infinite ease-in-out alternate;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-15px) rotate(10deg); }
        }

        /* Fixed Controls Top Bar */
        .controls-bar {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 100;
        }

        .icon-btn {
            background: var(--paper-bg);
            border: 2px dashed var(--doodle-color);
            border-radius: 12px;
            padding: 10px;
            cursor: pointer;
            color: var(--doodle-color);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 4px 4px 0px var(--doodle-color);
        }

        .icon-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--doodle-color);
        }

        .icon-btn:active {
            transform: translate(0, 0);
            box-shadow: 2px 2px 0px var(--doodle-color);
        }

        /* Container */
        .wrapper {
            margin-top: 40px;
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
        }

        /* Security Lock Screen */
        .lock-container {
            width: 100%;
            max-width: 450px;
            background: var(--paper-bg);
            border: 3px solid var(--doodle-color);
            border-radius: 16px;
            padding: 30px 20px;
            box-shadow: 8px 8px 0px var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            text-align: center;
            animation: bounceIn 0.8s ease-out;
        }

        .lock-input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 280px;
        }

        .lock-input {
            width: 100%;
            padding: 12px;
            font-family: inherit;
            font-size: 1rem;
            text-align: center;
            border: 2px dashed var(--doodle-color);
            border-radius: 12px;
            background: var(--bg-color);
            color: var(--text-color);
            outline: none;
        }

        .lock-input:focus {
            border-style: solid;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 0.85rem;
            font-weight: bold;
            display: none;
        }

        /* Envelope Container */
        .envelope-container {
            display: none;
            width: 100%;
            max-width: 450px;
            height: 280px;
            background: var(--paper-bg);
            border: 3px solid var(--doodle-color);
            border-radius: 16px;
            position: relative;
            cursor: pointer;
            box-shadow: 8px 8px 0px var(--shadow);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            overflow: hidden;
            animation: bounceIn 0.8s ease-out;
        }

        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.8); }
            60% { opacity: 1; transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        .envelope-container:hover {
            transform: scale(1.02);
            box-shadow: 10px 10px 0px var(--doodle-color);
        }

        .envelope-doodle {
            border: 2px dashed var(--doodle-color);
            border-radius: 50%;
            padding: 20px;
            background: var(--bg-color);
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .envelope-text {
            font-weight: bold;
            letter-spacing: 1px;
            color: var(--doodle-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Jukebox Widget */
        .jukebox {
            display: none;
            width: 100%;
            max-width: 380px;
            background: var(--paper-bg);
            border: 3px solid var(--doodle-color);
            border-radius: 20px;
            padding: 15px 20px;
            margin-bottom: 20px;
            box-shadow: 6px 6px 0px var(--doodle-color);
            align-items: center;
            gap: 15px;
            animation: popUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .jukebox.active {
            display: flex;
        }

        /* CD Graphic & Spin Animation */
        .cd-container {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: repeating-radial-gradient(circle, var(--doodle-color), var(--doodle-color) 4px, var(--paper-bg) 5px, var(--paper-bg) 8px);
            border: 3px solid var(--doodle-color);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
        }

        .cd-center {
            width: 18px;
            height: 18px;
            background: var(--paper-bg);
            border: 2px solid var(--doodle-color);
            border-radius: 50%;
        }

        .cd-spinning {
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .jukebox-info {
            flex-grow: 1;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--doodle-color);
        }

        /* Letter Styling */
        .letter-container {
            display: none;
            width: 100%;
            background: var(--paper-bg);
            border: 3px solid var(--doodle-color);
            border-radius: 16px;
            padding: 40px 30px 25px 30px;
            box-shadow: 8px 8px 0px var(--shadow);
            position: relative;
            background-image: linear-gradient(var(--line-color) 1px, transparent 1px);
            background-size: 100% 28px;
            line-height: 28px;
        }

        .letter-container.active {
            display: block;
            animation: fadeIn 0.8s ease-in-out;
        }

        .typing-area {
            white-space: pre-wrap;
            font-size: 1.05rem;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        /* Pen Animation */
        .pen-icon {
            display: inline-block;
            vertical-align: middle;
            color: var(--doodle-color);
            animation: writeMotion 0.5s infinite alternate ease-in-out;
            margin-left: 4px;
        }

        @keyframes writeMotion {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-5px) rotate(-15deg); }
        }

        /* Letter Controls Inside Paper */
        .letter-controls {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
            padding-top: 10px;
            border-top: 2px dashed var(--line-color);
        }

        /* Interactive Action Buttons Bar (Always Visible) */
        .interactive-section {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 25px;
            width: 100%;
            animation: fadeIn 0.8s ease-in-out;
        }

        .action-btn {
            background: var(--paper-bg);
            border: 2px solid var(--doodle-color);
            border-radius: 20px;
            padding: 10px 16px;
            font-family: inherit;
            font-weight: bold;
            color: var(--doodle-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 3px 3px 0px var(--doodle-color);
        }

        .action-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--doodle-color);
            background: var(--bg-color);
        }

        .action-btn:active {
            transform: translate(0, 0);
            box-shadow: 1px 1px 0px var(--doodle-color);
        }

        /* Modal Overlay for Action Buttons */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .modal-content {
            background: var(--paper-bg);
            border: 3px solid var(--doodle-color);
            border-radius: 16px;
            padding: 25px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 6px 6px 0px var(--doodle-color);
            animation: popUp 0.3s ease-out;
        }

        @keyframes popUp {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-content p {
            margin: 15px 0;
            line-height: 1.5;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Floating Background Doodles -->
    <i data-lucide="sparkles" class="bg-doodle" style="top: 10%; left: 8%;" size="40"></i>
    <i data-lucide="heart" class="bg-doodle" style="top: 20%; right: 10%; animation-delay: 1s;" size="36"></i>
    <i data-lucide="cloud" class="bg-doodle" style="top: 75%; left: 5%; animation-delay: 2s;" size="48"></i>
    <i data-lucide="star" class="bg-doodle" style="top: 80%; right: 8%; animation-delay: 1.5s;" size="32"></i>

    <!-- Controls Top Bar -->
    <div class="controls-bar">
        <button class="icon-btn" id="musicToggle" title="Toggle Music">
            <i data-lucide="music"></i>
        </button>
        <button class="icon-btn" id="themeToggle" title="Toggle Dark/Light Mode">
            <i data-lucide="moon" id="themeIcon"></i>
        </button>
    </div>

    <!-- Hidden Audio Player -->
    <audio id="bgMusic" loop>
        <source src="Libu-Libong Buwan (Uuwian).mp3" type="audio/mpeg">
    </audio>

    <div class="wrapper">
        <!-- Interactive Jukebox Player (Appears when letter opens) -->
        <div class="jukebox" id="jukebox">
            <div class="cd-container cd-spinning" id="cdDisc">
                <div class="cd-center"></div>
            </div>
            <div class="jukebox-info">
                <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 4px;">
                    <i data-lucide="disc" size="16"></i> NOW PLAYING
                </div>
                <div style="font-size: 0.75rem; opacity: 0.8;" id="musicStatusText">Playing Love Theme...</div>
            </div>
            <button class="icon-btn" id="jukeboxPlayBtn" style="padding: 6px;" title="Pause/Play Music">
                <i data-lucide="pause" size="18" id="playPauseIcon"></i>
            </button>
        </div>

        <!-- Lock Question Screen -->
        <div class="lock-container" id="lockScreen">
            <div class="envelope-doodle">
                <i data-lucide="lock" size="40" color="var(--doodle-color)"></i>
            </div>
            <h3 style="color: var(--doodle-color); font-size: 1.1rem;">Answer to Unlock:</h3>
            <p style="font-weight: bold;">Who is the cutest baby on earth?</p>
            <div class="lock-input-group">
                <input type="text" id="passInput" class="lock-input" placeholder="Type answer here..." autocomplete="off">
                <button class="action-btn" style="justify-content: center;" onclick="checkPassword()">
                    <i data-lucide="key-round"></i> Unlock Letter
                </button>
            </div>
            <div class="error-msg" id="errorMsg">Wrong answer! Try again baby!</div>
        </div>

        <!-- Envelope Frame -->
        <div class="envelope-container" id="envelope">
            <div class="envelope-doodle">
                <i data-lucide="mail-open" size="48" color="var(--doodle-color)"></i>
            </div>
            <div class="envelope-text">
                <i data-lucide="heart"></i> OPEN MY LETTER <i data-lucide="heart"></i>
            </div>
        </div>

        <!-- Written Letter Content -->
        <div class="letter-container" id="letter">
            <span class="typing-area" id="typedText"></span><span class="pen-icon" id="pen"><i data-lucide="pen-tool" size="22"></i></span>
            
            <div class="letter-controls">
                <button class="action-btn" id="replayBtn" style="padding: 6px 12px; font-size: 0.85rem;">
                    <i data-lucide="rotate-ccw" size="16"></i> Replay Letter
                </button>
            </div>
        </div>

        <!-- Interactive Action Buttons -->
        <div class="interactive-section" id="actions">
            <button class="action-btn" onclick="showMessage('Hug Sent!', 'Sending you a tight, warm hug right now. I miss you!')">
                <i data-lucide="heart-handshake"></i> Send Hug
            </button>
            <button class="action-btn" onclick="showMessage('Daily Reminder', 'You are loved, appreciated, and enough. Always.')">
                <i data-lucide="bell"></i> Reminder
            </button>
            <button class="action-btn" onclick="showMessage('Make a Wish', 'Close your eyes, make a wish, and let me know so I can help make it come true!')">
                <i data-lucide="wand-2"></i> Make a Wish
            </button>
            <button class="action-btn" onclick="showMessage('A Promise', 'I will always choose you, listen to you, and support you.')">
                <i data-lucide="shield-check"></i> My Promise
            </button>
            <button class="action-btn" onclick="showMessage('Heart Lock', 'Locked forever in my heart. No key allowed!')">
                <i data-lucide="lock"></i> Lock Heart
            </button>
            <button class="action-btn" onclick="showMessage('Sweet Kiss', 'Sending you a big forehead kiss to make your day better!')">
                <i data-lucide="sparkles"></i> Sweet Kiss
            </button>
            <button class="action-btn" onclick="showMessage('Emergency Comfort', 'Whenever you feel sad or stressed, just remember I am always right here for you.')">
                <i data-lucide="life-buoy"></i> Comfort Me
            </button>
        </div>
    </div>

    <!-- Interactive Response Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h3 id="modalTitle" style="color: var(--doodle-color); font-size: 1.2rem;"></h3>
            <p id="modalBody"></p>
            <button class="action-btn" style="margin: 0 auto;" onclick="closeMessage()">
                <i data-lucide="check-circle"></i> Close
            </button>
        </div>
    </div>

<script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Security Lock Logic
        const lockScreen = document.getElementById('lockScreen');
        const passInput = document.getElementById('passInput');
        const errorMsg = document.getElementById('errorMsg');
        const envelope = document.getElementById('envelope');

        function checkPassword() {
            const answer = passInput.value.trim().toLowerCase();
            if (answer === 'sugar') {
                lockScreen.style.display = 'none';
                envelope.style.display = 'flex';
                errorMsg.style.display = 'none';
            } else {
                errorMsg.style.display = 'block';
                passInput.value = '';
            }
        }

        // Support Enter keypress on input
        passInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        // Theme Toggle Logic
        const themeToggleBtn = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        
        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            
            themeIcon.setAttribute('data-lucide', newTheme === 'dark' ? 'sun' : 'moon');
            lucide.createIcons();
        });

        // Audio & Jukebox Logic
        const bgMusic = document.getElementById('bgMusic');
        const musicToggleBtn = document.getElementById('musicToggle');
        const jukeboxPlayBtn = document.getElementById('jukeboxPlayBtn');
        const playPauseIcon = document.getElementById('playPauseIcon');
        const cdDisc = document.getElementById('cdDisc');
        const musicStatusText = document.getElementById('musicStatusText');
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                bgMusic.pause();
                isPlaying = false;
                cdDisc.classList.remove('cd-spinning');
                playPauseIcon.setAttribute('data-lucide', 'play');
                musicStatusText.innerText = 'Music Paused';
            } else {
                bgMusic.play().then(() => {
                    isPlaying = true;
                    cdDisc.classList.add('cd-spinning');
                    playPauseIcon.setAttribute('data-lucide', 'pause');
                    musicStatusText.innerText = 'Playing Love Theme...';
                }).catch(() => {
                    isPlaying = false;
                });
            }
            lucide.createIcons();
        }

        musicToggleBtn.addEventListener('click', toggleMusic);
        jukeboxPlayBtn.addEventListener('click', toggleMusic);

        // Letter Text Content
        const letterText = `hello mahal, gusto ko lang sabihin sa’yo na mahal na mahal kita. kahit anong mangyari, pipiliin at mamahalin pa rin kita. kahit paulit-ulit tayong mag-away, kahit may times na hindi tayo nagkakaintindihan, hindi ibig sabihin nun na mababawasan yung pagmamahal ko sa’yo. knowing you more could never lead me to loving you less. the more i get to know you, the more reasons i find to love you and appreciate you.\n\ngusto ko rin malaman mo kung gaano ako kaswerte na magkaroon ng isang taong tulad mo. sobrang swerte ko kasi may isang taong nandiyan para sa’kin araw-araw, isang taong hindi ako sinusukuan, hindi nawawala kapag kailangan kita, at palaging sinusubukang intindihin ako kahit hindi ako madaling intindihin minsan.\n\nkaya please, don’t be too harsh on yourself, okay po? hindi ka mahirap mahalin. hindi mo kailangang maging perfect para mahalin kita. kahit may flaws ka, kahit may times na nagkakamali ka, ikaw pa rin yung taong gusto kong piliin. sana kapag dumating yung time na feeling mo hindi ka enough, maalala mo na nandito ako, loving you exactly as you are. mahal na mahal kita, my baby, my asawa, mahal, and my forever servant`;

        // Typewriter Animation Logic
        const letter = document.getElementById('letter');
        const jukebox = document.getElementById('jukebox');
        const typedTextContainer = document.getElementById('typedText');
        const penIcon = document.getElementById('pen');
        const replayBtn = document.getElementById('replayBtn');

        let textIndex = 0;
        let typingTimer = null;
        const typingSpeed = 65; // Balanced typing speed

        envelope.addEventListener('click', () => {
            envelope.style.display = 'none';
            jukebox.classList.add('active');
            letter.classList.add('active');
            
            // Auto play music when opening letter
            if (!isPlaying) {
                toggleMusic();
            }

            startTyping();
        });

        function startTyping() {
            typedTextContainer.textContent = '';
            textIndex = 0;
            penIcon.style.display = 'inline-block';
            typeLetter();
        }

        function typeLetter() {
            if (textIndex < letterText.length) {
                typedTextContainer.textContent += letterText.charAt(textIndex);
                textIndex++;
                typingTimer = setTimeout(typeLetter, typingSpeed);
            } else {
                penIcon.style.display = 'none'; // Hide pen when finished writing
            }
        }

        // Replay Button Logic
        replayBtn.addEventListener('click', () => {
            clearTimeout(typingTimer);
            startTyping();
        });

        // Modal Action Logic
        function showMessage(title, message) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerText = message;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeMessage() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
